name: Bug report
description: Report a bug for Hermes to investigate and fix
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible bugs.
        Add the `agent-fix` label only when you want Hermes to work on it.

  - type: input
    id: summary
    attributes:
      label: Short summary
      description: One-sentence description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps Hermes should follow
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Allowed scope for fix
      description: Tell Hermes how far it may go
    validations:
      required: true